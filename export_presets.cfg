encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<style>#wp-about{position:fixed;left:0;right:0;bottom:6vh;text-align:center;color:#f4ead6;font-family:system-ui,sans-serif;padding:0 20px;pointer-events:none;z-index:5}#wp-about b{display:block;font-size:20px;letter-spacing:.14em;color:#ffd58a;margin-bottom:8px}#wp-about span{display:block;font-size:14px;line-height:1.55;max-width:600px;margin:0 auto 6px;opacity:.92}</style><script>addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.id='wp-about';d.innerHTML='<b>WILD PAKISTAN - THE LAST WILDERNESS</b><span>Live as the wild animals of Pakistan, or protect them as a ranger. Survive the Thar Desert, the Indus River, the Ziarat forest, Deosai and the Northern Mountains.</span><span>Many of these species are close to extinction. Your choices matter.</span><span style=\"opacity:.65\">Loading the wilderness...</span>';document.body.appendChild(d);window.wpReady=function(){var e=document.getElementById('wp-about');if(e)e.remove()};var t=setInterval(function(){var s=document.getElementById('status');if(s&&s.style.visibility==='hidden'){d.remove();clearInterval(t)}},400)})</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
