name: Build and publish web game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
      - name: Import project
        run: godot --headless --import || true
      - name: Smoke test (results appear in the log)
        run: godot --headless --path . -s tests/smoke_test.gd 2>&1 | tee smoke.log || true
      - name: Export for web
        run: |
          mkdir -v -p build/web/game
          godot --headless --export-release "Web" build/web/game/index.html
          cp landing/index.html landing/three.module.js build/web/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
